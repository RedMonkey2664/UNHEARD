<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050708" />
    <link rel="icon" href="data:," />
    <title>UNHEARD</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #050708;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100%; height: 100%; }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #050708;
        color: #e8e2d0;
        font: 600 20px/1.4 Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #rotate.show { display: flex; }
      #rotate span { display: block; font-weight: 400; font-size: 16px; opacity: 0.7; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="alert">
      <div>Rotate your phone<span>UNHEARD is played in landscape.</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
